version: 2
updates:
  # Base images only. GitHub Actions stay hand-bumped (SHA + tag comment) after reading Aqua's advisory; see CLAUDE.md.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The Python version is a deliberate change that comes with the CI test matrix (3.11-3.13), never a bot bump.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
