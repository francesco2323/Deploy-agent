# Release: push a tag vX.Y.Z (from main) -> verify -> build -> GitHub Release with checksums.
# Then (optional) the CLI image goes to Docker Hub. Nothing goes to PyPI. No cloud account involved.
# Docker Hub needs repo variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (access token, Read+Write on that repo only).
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write                   # create the release; nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Tag must match the package version, be on main, and have a changelog entry
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="$(python -c 'import sys;sys.path.insert(0,"src");import deploy_agent;print(deploy_agent.__version__)')"
          test "$V" = "$P" || { echo "tag $V != __version__ $P"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "no CHANGELOG entry for $V"; exit 1; }
      - run: pip install build -e ".[dev]"
      - run: pytest -q
      - run: python -m build
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          PRE=""; case "$V" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "deploy-agent $V" --notes-file notes.md $PRE

  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/deploy-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Docker Hub configured?
        id: cfg
        env: { U: "${{ vars.DOCKERHUB_USERNAME }}", T: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: |
          if [ -n "$U" ] && [ -n "$T" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Docker Hub not configured: skipping image push"; fi
      - if: steps.cfg.outputs.on == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - if: steps.cfg.outputs.on == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (amd64) and scan before anything is pushed
        if: steps.cfg.outputs.on == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: scan:local
          build-args: VERSION=${{ github.ref_name }}
      - name: Trivy gate (HIGH/CRITICAL with a fix available)
        if: steps.cfg.outputs.on == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3                 # known-safe binary; v0.69.4 was malicious
          image-ref: scan:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: steps.cfg.outputs.on == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push multi-arch (version + sha tags only)
        if: steps.cfg.outputs.on == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
